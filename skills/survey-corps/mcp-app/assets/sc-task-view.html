<!--
  Survey Corps MCP App task view. Codex loads this resource in its embedded host.
  Snapshot values are rendered only through textContent.
-->
<section class="sc-task-view" aria-labelledby="sc-task-view-title">
  <style>
    .sc-task-view { --bg:#080b10; --panel:#0d1219; --panel-active:#101923; --line:#4b5869; --text:#e8edf3; --muted:#9ba8b8; --focus:#b9e2ff; --pending:#95a3b5; --active:#46b8ee; --completed:#27c9b0; --ok:#4bd882; --warn:#e9c85c; --revision:#ec9b4f; --danger:#ed7589; --unknown:#fff; box-sizing:border-box; width:min(680px,100%); margin:0 auto; padding:20px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace; }
    .sc-task-view *, .sc-task-view *::before, .sc-task-view *::after { box-sizing:inherit; }
    .sc-task-view h2, .sc-task-view h3, .sc-task-view p { margin:0; }
    .sc-task-view h2 { font-size:24px; }
    .sc-task-view h3 { margin-top:10px; color:var(--muted); font-size:11px; text-transform:uppercase; }
    .sc-task-view__header { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:12px; padding-bottom:14px; border-bottom:1px solid var(--line); }
    .sc-task-view__header-controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .sc-task-view__muted { color:var(--muted); }
    .sc-task-view__status { justify-self:end; max-width:100%; padding:4px 10px; border:1px solid var(--line); color:var(--muted); font-size:18px; font-weight:700; text-align:center; overflow-wrap:anywhere; }
    .sc-task-view__flow { display:flex; flex-direction:column; align-items:stretch; margin-top:18px; }
    .sc-task-view__node { min-width:0; border:1px solid var(--line); background:var(--panel); }
    .sc-task-view__root { padding:14px; text-align:center; }
    .sc-task-view__target { margin-top:4px !important; overflow-wrap:anywhere; font-size:16px; font-weight:700; }
    .sc-task-view__root-meta { display:flex; justify-content:center; gap:8px 16px; flex-wrap:wrap; margin-top:8px; color:var(--muted); }
    .sc-task-view__role-name { display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 10px; min-width:0; }
    .sc-task-view__task-summary { margin-top:18px; overflow-wrap:anywhere; }
    .sc-task-view__task-summary p { margin-top:4px; }
    .sc-task-view [hidden] { display:none !important; }
    .sc-task-view__connector { position:relative; flex:none; width:12px; height:24px; margin:0 auto; color:var(--muted); transform-origin:top; }
    .sc-task-view__connector::before { content:""; position:absolute; top:0; left:5px; width:2px; height:17px; background:currentColor; }
    .sc-task-view__connector::after { content:""; position:absolute; left:2px; bottom:4px; width:8px; height:8px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(45deg); }
    .sc-task-view__roles { display:flex; flex-direction:column; align-items:stretch; }
    .sc-task-view details { min-width:0; border:1px solid var(--line); background:var(--panel); }
    .sc-task-view details[data-sc-role] { position:relative; border-color:var(--line); }
    .sc-task-view details[data-sc-role].is-active { border-color:transparent; background:var(--panel-active); }
    .sc-task-view details[data-sc-role].is-active::before { content:""; position:absolute; z-index:0; inset:0; padding:1px; background:conic-gradient(from 0deg,transparent 0 68%,color-mix(in srgb,var(--focus) 55%,var(--line)) 82%,var(--line) 94%,transparent); -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; opacity:.55; pointer-events:none; animation:sc-thinking-border 8s linear infinite; }
    .sc-task-view details[data-sc-role].is-active > * { position:relative; z-index:1; }
    .sc-task-view summary { display:flex; justify-content:space-between; gap:12px; padding:11px 12px; cursor:pointer; font-weight:700; list-style-position:inside; overflow-wrap:anywhere; }
    .sc-task-view summary:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
    .sc-task-view__role-state { color:var(--muted); font-weight:400; text-align:right; }
    .sc-task-view .sc-task-view__state--pending { color:var(--pending); }
    .sc-task-view .sc-task-view__state--active { color:var(--active); }
    .sc-task-view .sc-task-view__state--completed { color:var(--completed); }
    .sc-task-view .sc-task-view__state--passed { color:var(--ok); }
    .sc-task-view .sc-task-view__state--danger { color:var(--danger); }
    .sc-task-view .sc-task-view__state--waiting { color:var(--warn); }
    .sc-task-view .sc-task-view__state--revision { color:var(--revision); }
    .sc-task-view .sc-task-view__state--unknown { color:var(--unknown); }
    .sc-task-view .sc-task-view__placeholder { color:#fff; }
    .sc-task-view__detail { padding:0 12px 12px; border-top:1px solid #273241; }
    .sc-task-view__detail ul { margin:5px 0 0; padding-left:18px; }
    .sc-task-view__detail li, .sc-task-view__detail p { overflow-wrap:anywhere; }
    .sc-task-view__empty { color:#fff; font-style:italic; }
    .sc-task-view details.sc-task-view__subskill { margin-top:6px; border:0; border-top:1px solid #273241; background:transparent; }
    .sc-task-view__subskill summary { padding:7px 0; font-weight:400; }
    .sc-task-view__subskill summary > span:first-child { min-width:0; }
    .sc-task-view__subskill > div { padding:0 0 6px; }
    .sc-task-view__subskill [data-sc-subskill-reply-hint] { margin-top:6px; }
    .sc-task-view__play { padding:5px 9px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; cursor:pointer; }
    .sc-task-view__play:hover { border-color:var(--focus); color:var(--focus); }
    .sc-task-view__play:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
    .sc-task-view details.sc-task-view__node.is-manual-replay { animation:sc-manual-role 1.1s ease-in-out 2; }
    @keyframes sc-manual-role { 0%,100% { box-shadow:0 0 0 0 transparent; } 50% { box-shadow:0 0 0 6px color-mix(in srgb,var(--focus) 32%,transparent); } }
    @keyframes sc-thinking-border { to { transform:rotate(360deg); } }
    @media (max-width:560px) { .sc-task-view { padding:14px; } .sc-task-view__header { grid-template-columns:minmax(0,1fr); justify-items:stretch; } .sc-task-view__status { justify-self:center; } .sc-task-view__header-controls { justify-content:flex-end; } .sc-task-view summary { flex-direction:column; gap:3px; } .sc-task-view__role-state { text-align:left; } }
    @media (prefers-reduced-motion:reduce) { .sc-task-view *, .sc-task-view *::before, .sc-task-view *::after { animation:none !important; transition:none !important; } }
  </style>
  <header class="sc-task-view__header">
    <div><h2 id="sc-task-view-title">SC TASK FLOW</h2></div>
    <span class="sc-task-view__status" data-sc-field="state" aria-live="polite">未知</span>
    <div class="sc-task-view__header-controls"><button type="button" class="sc-task-view__play" data-sc-play-animation hidden aria-label="播放任务视图动画">播放动画</button></div>
  </header>
  <section class="sc-task-view__flow" data-sc-flow aria-label="SC 到 QA 的主工作流程">
    <article class="sc-task-view__node sc-task-view__root" data-sc-root>
      <p class="sc-task-view__target" data-sc-field="target">未提供</p>
      <dl class="sc-task-view__context-meta">
        <dt>任务类型</dt><dd data-sc-field="task_type">未提供</dd>
        <dt>参与角色</dt><dd data-sc-selected-roles>尚未选择</dd>
        <dt>选择原因</dt><dd data-sc-field="role_selection_reason">未提供</dd>
      </dl>
    </article>
    <div class="sc-task-view__roles" data-sc-roles aria-label="REQ、DEV、CR、QA 顺序任务"></div>
  </section>
  <section class="sc-task-view__task-summary" aria-label="任务总结">
    <h3>任务总结</h3><p data-sc-task-summary>暂无总结</p>
  </section>
  <script>
    "use strict";
    (() => {
      const labels={confirmed:"已确认",planned:"计划",dev_in_progress:"开发中",ready_for_cr:"等待审查",cr_blocked:"审查阻断",ready_for_qa:"等待测试",qa_failed:"测试失败",qa_conditional:"测试条件通过",qa_passed:"测试通过",workflow_ready:"工作流就绪",completed:"已完成",success:"已完成",succeeded:"已完成",needs_user_confirm:"等待用户确认",needs_revalidation:"需要重新验证",needs_revision:"需要修订",blocked:"已阻断"};
      const roles=["req","dev","cr","qa"],roleLabels={req:"REQ",dev:"DEV",cr:"CR",qa:"QA"};
      const stateRole={dev_in_progress:"dev"};
      const activeRoleStates=new Set(["running","preparing","in_progress","working","active","started","started_working"]);
      const asObject=value=>value&&typeof value==="object"&&!Array.isArray(value)?value:{};
      const asList=value=>Array.isArray(value)?value:value===undefined||value===null||value===""?[]:[value];
      const safeText=value=>value===undefined||value===null||value===""?"未提供":typeof value==="object"?JSON.stringify(value):String(value);
      const missing=value=>value===undefined||value===null||value==="";
      const stateText=value=>Object.hasOwn(labels,value)?labels[value]:"未知状态";
      const stateTones={confirmed:"completed",planned:"pending",dev_in_progress:"active",ready_for_cr:"waiting",cr_blocked:"danger",ready_for_qa:"waiting",qa_failed:"danger",qa_conditional:"revision",qa_passed:"passed",workflow_ready:"passed",completed:"completed",success:"completed",succeeded:"completed",needs_user_confirm:"waiting",needs_revalidation:"revision",needs_revision:"revision",blocked:"danger"};
      const toneClass=(tones,value)=>`sc-task-view__state--${Object.hasOwn(tones,value)?tones[value]:"unknown"}`;
      const stateClass=value=>toneClass(stateTones,value);
      const normalizedStatus=value=>safeText(value).trim().toLowerCase().replace(/[ -]+/g,"_");
      const roleStatusLabels={pending:"待开始",not_started:"待开始",running:"进行中",preparing:"进行中",in_progress:"进行中",working:"进行中",active:"进行中",started:"进行中",started_working:"进行中",completed:"已完成",complete:"已完成",done:"已完成",success:"已完成",successful:"已完成",succeeded:"已完成",passed:"已通过",qa_passed:"已通过",qa_success:"已通过",workflow_ready:"已通过",failed:"失败",blocked:"已阻断",paused:"已暂停",cancelled:"已取消",canceled:"已取消",skipped:"已跳过",waiting:"等待中",needs_user_confirm:"等待用户确认",needs_revision:"需要修订"};
      const roleStatusText=value=>value===undefined||value===null||value===""?"状态未提供":Object.hasOwn(roleStatusLabels,normalizedStatus(value))?roleStatusLabels[normalizedStatus(value)]:"未知状态";
      const roleStatusTones={pending:"pending",not_started:"pending",running:"active",preparing:"active",in_progress:"active",working:"active",active:"active",started:"active",started_working:"active",completed:"completed",complete:"completed",done:"completed",success:"completed",successful:"completed",succeeded:"completed",passed:"passed",qa_passed:"passed",qa_success:"passed",workflow_ready:"passed",failed:"danger",blocked:"danger",paused:"waiting",cancelled:"pending",canceled:"pending",skipped:"pending",waiting:"waiting",needs_user_confirm:"waiting",needs_revision:"revision"};
      const roleStatusClass=value=>toneClass(roleStatusTones,normalizedStatus(value));
      const optionalText=value=>typeof value==="string"?value.trim():"";
      function renderRootMetadata(root,work) {
        const selected=[...new Set(asList(work.roles).filter(value=>typeof value==="string").map(value=>value.trim().toLowerCase()).filter(value=>roles.includes(value)))];
        const selectedNode=root.querySelector("[data-sc-selected-roles]"),summaryNode=root.querySelector("[data-sc-task-summary]"),summary=optionalText(work.summary);
        selectedNode.textContent=selected.length?selected.map(role=>roleLabels[role]).join(" → "):"尚未选择";
        selectedNode.classList.toggle("sc-task-view__placeholder",!selected.length);
        summaryNode.textContent=summary||"暂无总结";
        summaryNode.classList.toggle("sc-task-view__placeholder",!summary);
      }
      const isActiveRoleStatus=value=>activeRoleStates.has(normalizedStatus(value));
      function resolveActiveRole(details,state) { const explicit=roles.filter(role=>isActiveRoleStatus(asObject(details[role]).status)); if (explicit.length) return explicit.at(-1); const mapped=stateRole[state]; return mapped&&!missing(asObject(details[mapped]).status)?null:mapped||null; }
      function renderList(container,value) { const values=asList(value); container.replaceChildren(); if (!values.length) { const empty=document.createElement("p"); empty.className="sc-task-view__empty"; empty.textContent="未提供"; container.append(empty); return; } const list=document.createElement("ul"); values.forEach(value=>{ const item=document.createElement("li"); item.textContent=safeText(value); item.classList.toggle("sc-task-view__placeholder",missing(value)); list.append(item); }); container.append(list); }
      function detailField(body,label,value) { const heading=document.createElement("h3"),content=document.createElement("div"); heading.textContent=label; renderList(content,value); body.append(heading,content); }
      const subskillNames={req:["align-with-visuals","grill-with-docs"],dev:["tech-select"],cr:["review-with-goal"],qa:["test-with-goal"]};
      const stringList=value=>Array.isArray(value)?value.map(optionalText).filter(Boolean):[];
      function subskillField(body,field,label,value) {
        const values=Array.isArray(value)?value:optionalText(value);
        if (!values.length) return;
        const heading=document.createElement("h3"),content=document.createElement("div");
        heading.textContent=label;
        content.dataset.scSubskillField=field;
        renderList(content,values);
        body.append(heading,content);
      }
      function subskillNode(role,input) {
        const item=asObject(input),name=optionalText(item.name);
        if (!subskillNames[role].includes(name)) return null;
        const fields={goal:optionalText(item.goal),summary:optionalText(item.summary),question:optionalText(item.question),result:optionalText(item.result)},evidence=stringList(item.evidence);
        if (!Object.values(fields).some(Boolean)&&!evidence.length) return null;
        const node=document.createElement("details"),summary=document.createElement("summary"),title=document.createElement("span"),status=document.createElement("span"),body=document.createElement("div");
        node.className="sc-task-view__subskill";
        node.dataset.scSubskill=name;
        title.textContent=name;
        status.className=`sc-task-view__role-state ${roleStatusClass(item.status)}`;
        status.textContent=roleStatusText(item.status);
        summary.append(title,status);
        subskillField(body,"goal","目标",fields.goal);
        subskillField(body,"summary","摘要",fields.summary);
        subskillField(body,"question","待确认",fields.question);
        if (fields.question) {
          subskillField(body,"options","候选选项",stringList(item.options));
          const hint=document.createElement("p");
          hint.className="sc-task-view__muted";
          hint.dataset.scSubskillReplyHint="";
          hint.textContent="请在当前会话中回复。";
          body.append(hint);
        }
        subskillField(body,"evidence","证据",evidence);
        subskillField(body,"result","结果",fields.result);
        node.append(summary,body);
        return node;
      }
      function renderSubskills(body,role,value) {
        if (!Array.isArray(value)) return;
        const nodes=value.map(item=>subskillNode(role,item)).filter(Boolean);
        if (!nodes.length) return;
        const box=document.createElement("section"),heading=document.createElement("h3");
        box.className="sc-task-view__subskills";
        box.dataset.scSubskills="";
        box.setAttribute("aria-label",`${roleLabels[role]} 子技能`);
        heading.textContent="子技能";
        box.append(heading,...nodes);
        body.append(box);
      }
      function roleNode(role,detail,activeRole,openRole) { const node=document.createElement("details"),summary=document.createElement("summary"),name=document.createElement("span"),status=document.createElement("span"),body=document.createElement("div"); const active=role===activeRole; node.className=`sc-task-view__node${active?" is-active":""}`; node.open=role===openRole; node.dataset.scRole=role; if (active) node.setAttribute("aria-current","step"); name.className="sc-task-view__role-name"; const roleName=document.createElement("span"); roleName.textContent=roleLabels[role]; name.append(roleName); status.className=`sc-task-view__role-state ${roleStatusClass(detail.status)}`; status.textContent=roleStatusText(detail.status); summary.append(name,status); node.append(summary); body.className="sc-task-view__detail"; detailField(body,"摘要",detail.summary); detailField(body,"必要证据",detail.evidence); detailField(body,"风险",detail.risks); detailField(body,"下一步",detail.next_action); renderSubskills(body,role,detail.subskills); node.append(body); return node; }
      function renderRoles(root,details,activeRole,openRole,selectedRoles) { const box=root.querySelector("[data-sc-roles]"),fragment=document.createDocumentFragment(),orderedRoles=selectedRoles.length?selectedRoles:roles; box.setAttribute("aria-label",`${orderedRoles.map(role=>roleLabels[role]).join("、")} 顺序任务`); orderedRoles.forEach(role=>{ const connector=document.createElement("span"); connector.className="sc-task-view__connector"; connector.setAttribute("aria-hidden","true"); fragment.append(connector,roleNode(role,asObject(details[role]),activeRole,openRole)); }); box.replaceChildren(fragment); }
      function enforceSingleOpen(root) { root.__scAccordionCleanup?.(); const onToggle=event=>{ const opened=event.target; if (!opened.matches?.("details[data-sc-role]")||!opened.open) return; root.querySelectorAll("details[data-sc-role][open]").forEach(node=>{ if (node!==opened) node.open=false; }); }; root.addEventListener("toggle",onToggle,true); root.__scAccordionCleanup=()=>root.removeEventListener("toggle",onToggle,true); }
      const prefersReducedMotion=()=>matchMedia("(prefers-reduced-motion:reduce)").matches;
      function animateOnce(node,className,cleanups) { if (!node) return; node.classList.remove(className); void node.offsetWidth; node.classList.add(className); const finish=()=>{ node.classList.remove(className); node.removeEventListener("animationend",finish); node.removeEventListener("animationcancel",finish); }; node.addEventListener("animationend",finish,{once:true}); node.addEventListener("animationcancel",finish,{once:true}); cleanups.push(finish); }
      function bindAnimationControls(root) { if (root.__scAnimationButtonBound) return; const button=root.querySelector("[data-sc-play-animation]"); if (!button) return; const onClick=()=>{ if (!root.__scDebugMode) return; root.__scManualMotionCleanup?.(); root.__scManualMotionCleanup=undefined; if (prefersReducedMotion()) return; const cleanups=[]; animateOnce(root.querySelector("details.is-active"),"is-manual-replay",cleanups); root.__scManualMotionCleanup=()=>cleanups.forEach(cleanup=>cleanup()); }; button.addEventListener("click",onClick); root.__scAnimationButtonBound=true; root.__scAnimationButtonCleanup=()=>button.removeEventListener("click",onClick); }
      window.renderSurveyCorpsTaskView=(root,snapshot,options)=>{ if (!(root instanceof Element)) throw new TypeError("root 必须是一个 DOM 元素"); const input=asObject(snapshot),work=asObject(input.work_unit),details=asObject(input.role_details),state=input.state,selectedRoles=[...new Set(asList(work.roles).filter(value=>typeof value==="string").map(value=>value.trim().toLowerCase()).filter(value=>roles.includes(value)))],activeRole=resolveActiveRole(details,state),userOpenRole=root.querySelector("details[data-sc-role][open]")?.dataset.scRole,openRole=root.__scResolvedActiveRole===activeRole?userOpenRole:activeRole,values={target:work.target,task_type:work.task_type,role_selection_reason:work.role_selection_reason}; Object.entries(values).forEach(([name,value])=>root.querySelectorAll(`[data-sc-field="${name}"]`).forEach(node=>{ node.textContent=safeText(value); node.classList.toggle("sc-task-view__placeholder",missing(value)); })); const status=root.querySelector('[data-sc-field="state"]'); if (status) { status.textContent=stateText(state); status.className=`sc-task-view__status ${stateClass(state)}`; } renderRootMetadata(root,work); root.__scDebugMode=asObject(options).debug===true; const playButton=root.querySelector("[data-sc-play-animation]"); if (playButton) playButton.hidden=!root.__scDebugMode; if (!root.__scDebugMode) { root.__scManualMotionCleanup?.(); root.__scManualMotionCleanup=undefined; } renderRoles(root,details,activeRole,openRole,selectedRoles); root.__scResolvedActiveRole=activeRole; enforceSingleOpen(root); bindAnimationControls(root); };
    })();
  </script>
</section>
