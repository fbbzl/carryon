  Snapshot values are rendered only through textContent.

<section class="sc-task-view" aria-label="SC 任务流程">
  <style>
    .sc-task-view { --bg:#080b10; --panel:#0d1219; --panel-active:#101923; --line:#4b5869; --text:#e8edf3; --muted:#9ba8b8; --focus:#b9e2ff; --pending:#95a3b5; --active:#46b8ee; --completed:#27c9b0; --ok:#4bd882; --warn:#e9c85c; --revision:#ec9b4f; --danger:#ed7589; --unknown:#fff; box-sizing:border-box; width:min(680px,100%); margin:0 auto; padding:20px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:13px/1.6 "Segoe UI Variable","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif; }

    .sc-task-view__role-metrics dt { color:var(--muted); }

    .sc-task-view__role-name { display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 10px; min-width:0; }

    .sc-task-view__task-summary p { margin-top:4px; }

    .sc-task-view__connector { position:relative; flex:none; width:12px; height:24px; margin:0 auto; color:var(--muted); transform-origin:top; }
    .sc-task-view__connector::before { content:""; position:absolute; top:0; left:5px; width:2px; height:17px; background:currentColor; }
    .sc-task-view__connector::after { content:""; position:absolute; left:2px; bottom:4px; width:8px; height:8px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(45deg); }
    .sc-task-view__connector.is-handoff-flow { color:var(--active); }

    .sc-task-view__roles { display:flex; flex-direction:column; align-items:stretch; }
    .sc-task-view details { min-width:0; border:1px solid var(--line); border-radius:6px; background:var(--panel); transition:border-color 160ms ease,background-color 160ms ease,box-shadow 160ms ease; }
    .sc-task-view details[data-sc-role]:hover { transform:translateY(-1px); box-shadow:0 3px 12px color-mix(in srgb,#000 28%,transparent); }
    .sc-task-view details[data-sc-role] { position:relative; border-color:var(--line); }

    .sc-task-view summary:hover { background:color-mix(in srgb,var(--focus) 7%,transparent); }
    .sc-task-view summary:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
    .sc-task-view__role-state { color:var(--muted); font-weight:400; text-align:right; }
    .sc-task-view .sc-task-view__state--pending { color:var(--pending); }

    .sc-task-view .sc-task-view__state--passed { color:var(--ok); }
    .sc-task-view .sc-task-view__state--danger { color:var(--danger); }
    .sc-task-view .sc-task-view__state--waiting { color:var(--warn); }
    .sc-task-view .sc-task-view__state--revision { color:var(--revision); }
    .sc-task-view .sc-task-view__state--unknown { color:var(--unknown); }
    .sc-task-view .sc-task-view__placeholder { color:#fff; }
    .sc-task-view__detail { padding:0 12px 12px; border-top:1px solid #273241; }
    .sc-task-view [data-sc-detail-body].is-detail-revealing { animation:sc-detail-reveal 180ms ease-out 1; }
    .sc-task-view__detail ul { margin:5px 0 0; padding-left:18px; }
    .sc-task-view__detail li, .sc-task-view__detail p { overflow-wrap:anywhere; }
    .sc-task-view__empty { color:#fff; font-style:italic; }
    .sc-task-view details.sc-task-view__subskill { margin-top:6px; border:0; border-top:1px solid #273241; background:transparent; }
    .sc-task-view__subskill summary { padding:7px 0; font-weight:400; }
    .sc-task-view__subskill summary > span:first-child { min-width:0; }
    .sc-task-view__subskill > div { padding:0 0 6px; }
    .sc-task-view__subskill [data-sc-subskill-reply-hint] { margin-top:6px; }
    .sc-task-view__play { padding:5px 9px; border:1px solid var(--line); border-radius:5px; background:var(--panel); color:var(--text); font:inherit; cursor:pointer; transition:background-color 160ms ease; }
    .sc-task-view__play:hover { border-color:var(--focus); color:var(--focus); }
    .sc-task-view__play:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
    .sc-task-view details.sc-task-view__node.is-manual-replay { animation:sc-manual-role 1.1s ease-in-out 2; }
    @keyframes sc-manual-role { 0%,100% { box-shadow:0 0 0 0 transparent; } 50% { box-shadow:0 0 0 6px color-mix(in srgb,var(--focus) 32%,transparent); } }
    @keyframes sc-running-pulse { 0%,100% { box-shadow:0 0 0 1px color-mix(in srgb,var(--active) 26%,transparent),0 0 8px color-mix(in srgb,var(--active) 18%,transparent); } 50% { box-shadow:0 0 0 5px color-mix(in srgb,var(--active) 52%,transparent),0 0 26px color-mix(in srgb,var(--focus) 38%,transparent); } }
    @keyframes sc-handoff-flow { 0% { background-position:50% 100%; opacity:.5; } 35%,65% { opacity:1; } 100% { background-position:50% 0%; opacity:.5; } }
    @keyframes sc-handoff-receive { 0% { opacity:0; box-shadow:0 0 0 transparent; } 25% { opacity:1; box-shadow:0 0 18px color-mix(in srgb,var(--focus) 55%,transparent); } 100% { opacity:0; box-shadow:0 0 0 transparent; } }
    @keyframes sc-detail-reveal { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
    @media (max-width:560px) { .sc-task-view { padding:14px; } .sc-task-view__header { flex-direction:column; } .sc-task-view__project-mcps, .sc-task-view__header-controls { position:static; align-self:flex-start; max-width:100%; } .sc-task-view__header-controls { align-self:flex-end; } .sc-task-view summary { flex-direction:column; gap:3px; } .sc-task-view__project-mcps > summary { flex-direction:row; } .sc-task-view__role-state { text-align:left; } }
    @media (prefers-reduced-motion:reduce) { .sc-task-view *, .sc-task-view *::before, .sc-task-view *::after { animation:none !important; transition:none !important; } }
  </style>
  <header class="sc-task-view__header">
    <details class="sc-task-view__project-mcps" data-sc-project-mcps hidden>
      <summary><span>项目 MCP</span><span class="sc-task-view__project-mcp-count" data-sc-project-mcp-count></span></summary>
      <ul class="sc-task-view__project-mcp-list" data-sc-project-mcp-list></ul>
    </details>
    <span class="sc-task-view__status" data-sc-field="state" aria-live="polite">未知</span>
    <div class="sc-task-view__header-controls"><button type="button" class="sc-task-view__play" data-sc-play-animation hidden aria-label="播放任务视图动画">播放动画</button></div>
  </header>
  <section class="sc-task-view__flow" data-sc-flow aria-label="SC 到 QA 的主工作流程">
    <article class="sc-task-view__node sc-task-view__root" data-sc-root>
      <p class="sc-task-view__target" data-sc-field="target">未提供</p>
      <dl class="sc-task-view__metadata">
        <dt>任务类型</dt><dd data-sc-field="task_type">未提供</dd>
        <dt>参与角色</dt><dd data-sc-selected-roles>尚未选择</dd>
        <dt>选择原因</dt><dd data-sc-field="role_selection_reason">未提供</dd>
        <dt>累计耗时</dt><dd data-sc-metric="task-elapsed">未提供</dd>
      </dl>
    </article>
    <div class="sc-task-view__roles" data-sc-roles aria-label="REQ、DEV、CR、QA 顺序任务"></div>
  </section>
  <section class="sc-task-view__task-summary" aria-label="任务总结">
    <h3>任务总结</h3><p data-sc-task-summary>暂无总结</p>
  </section>
  <script>
    "use strict";
    (() => {
      const labels={confirmed:"已确认",planned:"计划",dev_in_progress:"开发中",ready_for_cr:"等待审查",cr_blocked:"审查阻断",ready_for_qa:"等待测试",qa_failed:"测试失败",qa_conditional:"测试条件通过",qa_passed:"测试通过",workflow_ready:"任务完成",completed:"已完成",complete:"已完成",done:"已完成",success:"已完成",successful:"已完成",succeeded:"已完成",failed:"失败",paused:"已暂停",waiting:"等待中",cancelled:"已取消",canceled:"已取消",needs_user_confirm:"等待用户确认",needs_revalidation:"需要重新验证",needs_revision:"需要修订",blocked:"已阻断"};
      const roles=["req","dev","cr","qa"],roleLabels={req:"REQ",dev:"DEV",cr:"CR",qa:"QA"};
      const stateRole={dev_in_progress:"dev"};
      const stoppedStates=new Set(["needs_user_confirm","paused","waiting","blocked","qa_passed","workflow_ready","completed","complete","done","success","successful","succeeded","failed","cancelled","canceled"]);
      const activeRoleStates=new Set(["running","preparing","in_progress","working","active","started","started_working"]);
      const asObject=value=>value&&typeof value==="object"&&!Array.isArray(value)?value:{};
      const asList=value=>Array.isArray(value)?value:value===undefined||value===null||value===""?[]:[value];
      const safeText=value=>value===undefined||value===null||value===""?"未提供":typeof value==="object"?JSON.stringify(value):String(value);
      const missing=value=>value===undefined||value===null||value==="";
      const stateText=value=>typeof value==="string"&&Object.hasOwn(labels,value)?labels[value]:"未知状态";
      const stateTones={confirmed:"completed",planned:"pending",dev_in_progress:"active",ready_for_cr:"waiting",cr_blocked:"danger",ready_for_qa:"waiting",qa_failed:"danger",qa_conditional:"revision",qa_passed:"passed",workflow_ready:"passed",completed:"completed",complete:"completed",done:"completed",success:"completed",successful:"completed",succeeded:"completed",failed:"danger",paused:"waiting",waiting:"waiting",cancelled:"pending",canceled:"pending",needs_user_confirm:"waiting",needs_revalidation:"revision",needs_revision:"revision",blocked:"danger"};
      const toneClass=(tones,value)=>`sc-task-view__state--${typeof value==="string"&&Object.hasOwn(tones,value)?tones[value]:"unknown"}`;
      const stateClass=value=>toneClass(stateTones,value);
      const normalizedStatus=value=>safeText(value).trim().toLowerCase().replace(/[ -]+/g,"_");
      const roleStatusLabels={pending:"待开始",not_started:"待开始",running:"进行中",preparing:"进行中",in_progress:"进行中",working:"进行中",active:"进行中",started:"进行中",started_working:"进行中",completed:"已完成",complete:"已完成",done:"已完成",success:"已完成",successful:"已完成",succeeded:"已完成",passed:"已通过",qa_passed:"已通过",qa_success:"已通过",workflow_ready:"已通过",failed:"失败",blocked:"已阻断",paused:"已暂停",cancelled:"已取消",canceled:"已取消",skipped:"已跳过",waiting:"等待中",waiting_user:"等待用户确认",needs_user_confirm:"等待用户确认",needs_revision:"需要修订"};
      const roleStatusText=value=>value===undefined||value===null||value===""?"状态未提供":Object.hasOwn(roleStatusLabels,normalizedStatus(value))?roleStatusLabels[normalizedStatus(value)]:"未知状态";
      const roleStatusTones={pending:"pending",not_started:"pending",running:"active",preparing:"active",in_progress:"active",working:"active",active:"active",started:"active",started_working:"active",completed:"completed",complete:"completed",done:"completed",success:"completed",successful:"completed",succeeded:"completed",passed:"passed",qa_passed:"passed",qa_success:"passed",workflow_ready:"passed",failed:"danger",blocked:"danger",paused:"waiting",cancelled:"pending",canceled:"pending",skipped:"pending",waiting:"waiting",waiting_user:"waiting",needs_user_confirm:"waiting",needs_revision:"revision"};
      const roleStatusClass=value=>toneClass(roleStatusTones,normalizedStatus(value));
      const optionalText=value=>typeof value==="string"?value.trim():"";
      const validMetric=value=>Number.isSafeInteger(value)&&value>=0;
      function formatElapsed(value) {
        if (!validMetric(value)) return "未提供";
        if (value<1000) return `${value}毫秒`;
        let seconds=Math.floor(value/1000);
        const days=Math.floor(seconds/86400); seconds%=86400;
        const hours=Math.floor(seconds/3600); seconds%=3600;
        const minutes=Math.floor(seconds/60); seconds%=60;
        if (days) return `${days}天 ${String(hours).padStart(2,"0")}小时 ${String(minutes).padStart(2,"0")}分 ${String(seconds).padStart(2,"0")}秒`;
        if (hours) return `${hours}小时 ${String(minutes).padStart(2,"0")}分 ${String(seconds).padStart(2,"0")}秒`;
        if (minutes) return `${minutes}分 ${String(seconds).padStart(2,"0")}秒`;
        return `${seconds}秒`;
      }
      function setMetric(node,value,format) {
        if (!node) return;
        const valid=validMetric(value);
        node.textContent=valid?format(value):"未提供";
        node.classList.toggle("sc-task-view__placeholder",!valid);
      }
      function renderTaskMetrics(root,work) {
        const metrics=asObject(work.metrics);
        setMetric(root.querySelector('[data-sc-metric="task-elapsed"]'),metrics.elapsed_ms,formatElapsed);
      }
      const projectMcpName=value=>{ const name=optionalText(value).toLowerCase(); return /^[a-z][a-z0-9._-]{0,63}$/.test(name)?name:""; };
      function renderProjectMcps(root,work) {
        const mcps=[...new Set(asList(work.project_mcps).map(projectMcpName).filter(Boolean))];
        const section=root.querySelector("[data-sc-project-mcps]"),count=root.querySelector("[data-sc-project-mcp-count]"),list=root.querySelector("[data-sc-project-mcp-list]");
        section.hidden=!mcps.length;
        if (!mcps.length) { list.replaceChildren(); return; }
        count.textContent=`(${mcps.length})`;
        list.replaceChildren(...mcps.map(name=>{ const item=document.createElement("li"); item.textContent=name; return item; }));
      }
      function renderRootMetadata(root,work) {
        const selected=[...new Set(asList(work.roles).filter(value=>typeof value==="string").map(value=>value.trim().toLowerCase()).filter(value=>roles.includes(value)))];
        const selectedNode=root.querySelector("[data-sc-selected-roles]"),summaryNode=root.querySelector("[data-sc-task-summary]"),summary=optionalText(work.summary);
        selectedNode.textContent=selected.length?selected.map(role=>roleLabels[role]).join(" → "):"尚未选择";
        selectedNode.classList.toggle("sc-task-view__placeholder",!selected.length);
        summaryNode.textContent=summary||"暂无总结";
        summaryNode.classList.toggle("sc-task-view__placeholder",!summary);
      }
      const isActiveRoleStatus=value=>activeRoleStates.has(normalizedStatus(value));
      function resolveActiveRole(details,state,selectedRoles) { if (stoppedStates.has(normalizedStatus(state))) return null; const explicit=selectedRoles.filter(role=>isActiveRoleStatus(asObject(details[role]).status)); if (explicit.length>1) return null; if (explicit.length) return explicit[0]; const mapped=typeof state==="string"&&Object.hasOwn(stateRole,state)?stateRole[state]:null; return selectedRoles.includes(mapped)&&missing(asObject(details[mapped]).status)?mapped:null; }
      function renderList(container,value) { const values=asList(value); container.replaceChildren(); if (!values.length) { const empty=document.createElement("p"); empty.className="sc-task-view__empty"; empty.textContent="未提供"; container.append(empty); return; } const list=document.createElement("ul"); values.forEach(value=>{ const item=document.createElement("li"); item.textContent=safeText(value); item.classList.toggle("sc-task-view__placeholder",missing(value)); list.append(item); }); container.append(list); }
      function detailField(body,label,value) { const heading=document.createElement("h3"),content=document.createElement("div"); heading.textContent=label; renderList(content,value); body.append(heading,content); }
      function renderRoleMetrics(body,value) {
        const metrics=asObject(value),heading=document.createElement("h3"),list=document.createElement("dl");
        heading.textContent="执行耗时";
        list.className="sc-task-view__role-metrics";
        const term=document.createElement("dt"),definition=document.createElement("dd");
        term.textContent="角色耗时";
        setMetric(definition,metrics.elapsed_ms,formatElapsed);
        list.append(term,definition);
        body.append(heading,list);
      }
      const subskillNames={req:["align-with-visuals","grill-with-docs"],dev:["tech-select","refactor-with-goal","bug-fix","bug-cause","optimize"],cr:["review-with-goal"],qa:["test-with-goal"]};
      const stringList=value=>Array.isArray(value)?value.map(optionalText).filter(Boolean):[];
      function subskillField(body,field,label,value) {
        const values=Array.isArray(value)?value:optionalText(value);
        if (!values.length) return;
        const heading=document.createElement("h3"),content=document.createElement("div");
        heading.textContent=label;
        content.dataset.scSubskillField=field;
        renderList(content,values);
        body.append(heading,content);
      }
      function subskillNode(role,input) {
        const item=asObject(input),name=optionalText(item.name);
        if (!subskillNames[role].includes(name)) return null;
        const fields={goal:optionalText(item.goal),summary:optionalText(item.summary),question:optionalText(item.question),result:optionalText(item.result)},evidence=stringList(item.evidence);
        if (!Object.values(fields).some(Boolean)&&!evidence.length) return null;
        const node=document.createElement("details"),summary=document.createElement("summary"),title=document.createElement("span"),status=document.createElement("span"),body=document.createElement("div");
        node.className="sc-task-view__subskill";
        node.dataset.scSubskill=name;
        title.textContent=name;
        status.className=`sc-task-view__role-state ${roleStatusClass(item.status)}`;
        status.textContent=roleStatusText(item.status);
        summary.append(title,status);
        subskillField(body,"goal","目标",fields.goal);
        subskillField(body,"summary","摘要",fields.summary);
        subskillField(body,"question","待确认",fields.question);
        if (fields.question) {
          subskillField(body,"options","候选选项",stringList(item.options));
          const hint=document.createElement("p");
          hint.className="sc-task-view__muted";
          hint.dataset.scSubskillReplyHint="";
          hint.textContent="请在当前会话中回复。";
          body.append(hint);
        }
        subskillField(body,"evidence","证据",evidence);
        subskillField(body,"result","结果",fields.result);
        body.dataset.scDetailBody="";
        node.append(summary,body);
        return node;
      }
      function renderSubskills(body,role,value) {
        if (!Array.isArray(value)) return;
        const nodes=value.map(item=>subskillNode(role,item)).filter(Boolean);
        if (!nodes.length) return;
        const box=document.createElement("section"),heading=document.createElement("h3");
        box.className="sc-task-view__subskills";
        box.dataset.scSubskills="";
        box.setAttribute("aria-label",`${roleLabels[role]} 子技能`);
        heading.textContent="子技能";
        box.append(heading,...nodes);
