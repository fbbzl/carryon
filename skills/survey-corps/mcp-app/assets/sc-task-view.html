<!--
  Survey Corps MCP App task view. Codex loads this resource in its embedded host.
  Snapshot values are rendered only through textContent.
-->
<section class="sc-task-view" aria-labelledby="sc-task-view-title">
  <style>
    .sc-task-view { --bg:#080b10; --panel:#0d1219; --panel-active:#101923; --line:#4b5869; --text:#e8edf3; --muted:#9ba8b8; --focus:#b9e2ff; --ok:#86efac; --warn:#fde68a; --danger:#fda4af; box-sizing:border-box; width:min(680px,100%); margin:0 auto; padding:20px; border:1px solid var(--line); background:var(--bg); color:var(--text); font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace; }
    .sc-task-view *, .sc-task-view *::before, .sc-task-view *::after { box-sizing:inherit; }
    .sc-task-view h2, .sc-task-view h3, .sc-task-view p { margin:0; }
    .sc-task-view h2 { font-size:24px; }
    .sc-task-view h3 { margin-top:10px; color:var(--muted); font-size:11px; text-transform:uppercase; }
    .sc-task-view__header { display:flex; align-items:start; justify-content:space-between; gap:12px; padding-bottom:14px; border-bottom:1px solid var(--line); }
    .sc-task-view__header-controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .sc-task-view__eyebrow, .sc-task-view__muted { color:var(--muted); }
    .sc-task-view__status { flex:none; padding:4px 8px; border:1px solid var(--line); color:var(--warn); font-weight:700; }
    .sc-task-view__status--ok { color:var(--ok); }
    .sc-task-view__status--danger { color:var(--danger); }
    .sc-task-view__flow { display:flex; flex-direction:column; align-items:stretch; margin-top:18px; }
    .sc-task-view__node { min-width:0; border:1px solid var(--line); background:var(--panel); }
    .sc-task-view__root { padding:14px; text-align:center; }
    .sc-task-view__target { margin-top:4px !important; overflow-wrap:anywhere; font-size:16px; font-weight:700; }
    .sc-task-view__root-meta { display:flex; justify-content:center; gap:8px 16px; flex-wrap:wrap; margin-top:8px; color:var(--muted); }
    .sc-task-view__connector { width:2px; height:22px; margin:0 auto; background:var(--line); transform-origin:top; }
    .sc-task-view__roles { display:flex; flex-direction:column; align-items:stretch; }
    .sc-task-view details { min-width:0; border:1px solid var(--line); background:var(--panel); }
    .sc-task-view details.is-active { border-color:var(--focus); background:var(--panel-active); animation:sc-active-role 2.2s ease-in-out infinite; }
    .sc-task-view summary { display:flex; justify-content:space-between; gap:12px; padding:11px 12px; cursor:pointer; font-weight:700; list-style-position:inside; overflow-wrap:anywhere; }
    .sc-task-view summary:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
    .sc-task-view__role-state { color:var(--muted); font-weight:400; text-align:right; }
    .sc-task-view__detail { padding:0 12px 12px; border-top:1px solid #273241; }
    .sc-task-view__detail ul { margin:5px 0 0; padding-left:18px; }
    .sc-task-view__detail li, .sc-task-view__detail p { overflow-wrap:anywhere; }
    .sc-task-view__empty { color:var(--muted); font-style:italic; }
    .sc-task-view__exit { align-self:center; padding:5px 9px; border:1px solid var(--focus); color:var(--focus); font-weight:700; }
    .sc-task-view__play { padding:5px 9px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; cursor:pointer; }
    .sc-task-view__play:hover { border-color:var(--focus); color:var(--focus); }
    .sc-task-view__play:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
    .sc-task-view__root.is-state-updated, .sc-task-view__status.is-state-updated { animation:sc-state-update .6s ease-out 1; }
    .sc-task-view.is-entering { animation:sc-view-enter .38s ease-out both; }
    .sc-task-view.is-entering .sc-task-view__node { animation:sc-node-enter .45s ease-out both; }
    .sc-task-view__flow.is-connection-entering .sc-task-view__connector { animation:sc-connection-enter .7s ease-out both; }
    .sc-task-view__flow.is-handoff-flow .sc-task-view__connector { animation:sc-handoff-flow .85s ease-out 1; }
    .sc-task-view details.sc-task-view__node.is-manual-replay { animation:sc-manual-role 1.1s ease-in-out 2; }
    @keyframes sc-state-update { from { box-shadow:0 0 0 0 color-mix(in srgb,var(--focus) 45%,transparent); } to { box-shadow:0 0 0 14px transparent; } }
    @keyframes sc-view-enter { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes sc-node-enter { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes sc-connection-enter { from { opacity:.2; transform:scaleY(0); } to { opacity:1; transform:scaleY(1); } }
    @keyframes sc-handoff-flow { 0%,100% { background:var(--line); } 50% { background:var(--focus); } }
    @keyframes sc-active-role { 0%,100% { box-shadow:0 0 0 0 transparent; } 50% { box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 16%,transparent); } }
    @keyframes sc-manual-role { 0%,100% { box-shadow:0 0 0 0 transparent; } 50% { box-shadow:0 0 0 6px color-mix(in srgb,var(--focus) 32%,transparent); } }
    @media (max-width:560px) { .sc-task-view { padding:14px; } .sc-task-view__header { flex-direction:column; } .sc-task-view__status { align-self:flex-start; } .sc-task-view summary { flex-direction:column; gap:3px; } .sc-task-view__role-state { text-align:left; } }
    @media (prefers-reduced-motion:reduce) { .sc-task-view *, .sc-task-view *::before, .sc-task-view *::after { animation:none !important; transition:none !important; } }
  </style>
  <header class="sc-task-view__header">
    <div><p class="sc-task-view__eyebrow">SURVEY CORPS / <span data-sc-field="view_id">未提供</span></p><h2 id="sc-task-view-title">SC TASK FLOW</h2></div>
    <div class="sc-task-view__header-controls"><button type="button" class="sc-task-view__play" data-sc-play-animation aria-label="播放任务视图动画">播放动画</button><span class="sc-task-view__status" data-sc-field="state" aria-live="polite">未知</span></div>
  </header>
  <section class="sc-task-view__flow" data-sc-flow aria-label="SC 到 QA 的主工作流程">
    <article class="sc-task-view__node sc-task-view__root" data-sc-root>
      <p class="sc-task-view__muted">SC / WORK UNIT</p>
      <p class="sc-task-view__target" data-sc-field="target">未提供</p>
      <div class="sc-task-view__root-meta"><span data-sc-field="work_unit_id">未提供</span><span data-sc-field="reference_version">未提供</span></div>
    </article>
    <div class="sc-task-view__roles" data-sc-roles aria-label="REQ、DEV、CR、QA 顺序任务"></div>
    <p class="sc-task-view__exit" data-sc-exit>QA · 唯一任务出口</p>
  </section>
  <script>
    "use strict";
    (() => {
      const states=["confirmed","planned","dev_in_progress","ready_for_cr","cr_blocked","ready_for_qa","qa_failed","qa_conditional","qa_passed","workflow_ready","needs_user_confirm","needs_revalidation","needs_revision","blocked"];
      const labels={confirmed:"已确认",planned:"计划",dev_in_progress:"开发中",ready_for_cr:"等待 CR",cr_blocked:"CR 阻断",ready_for_qa:"等待 QA",qa_failed:"QA 失败",qa_conditional:"QA 条件通过",qa_passed:"QA 通过",workflow_ready:"工作流就绪",needs_user_confirm:"等待用户确认",needs_revalidation:"需要重新验证",needs_revision:"需要修订",blocked:"已阻断"};
      const roles=["req","dev","cr","qa"],roleLabels={req:"REQ",dev:"DEV",cr:"CR",qa:"QA"};
      const stateRole={dev_in_progress:"dev",ready_for_cr:"cr",ready_for_qa:"qa"};
      const activeRoleStates=new Set(["running","preparing","in_progress","working","active","started","started_working"]);
      const asObject=value=>value&&typeof value==="object"&&!Array.isArray(value)?value:{};
      const asList=value=>Array.isArray(value)?value:value===undefined||value===null||value===""?[]:[value];
      const safeText=value=>value===undefined||value===null||value===""?"未提供":typeof value==="object"?JSON.stringify(value):String(value);
      const stateText=value=>states.includes(value)?`${labels[value]} (${value})`:value?`未知 (${safeText(value)})`:"未知";
      const stateClass=value=>["qa_passed","workflow_ready"].includes(value)?"sc-task-view__status--ok":["cr_blocked","qa_failed","blocked"].includes(value)?"sc-task-view__status--danger":"";
      const normalizedStatus=value=>safeText(value).trim().toLowerCase().replace(/[ -]+/g,"_");
      const isActiveRoleStatus=value=>activeRoleStates.has(normalizedStatus(value));
      function resolveActiveRole(details,state) { const explicit=roles.filter(role=>isActiveRoleStatus(asObject(details[role]).status)); return explicit.length?explicit.at(-1):(stateRole[state]||null); }
      function renderList(container,value) { const values=asList(value); container.replaceChildren(); if (!values.length) { const empty=document.createElement("p"); empty.className="sc-task-view__empty"; empty.textContent="未提供"; container.append(empty); return; } const list=document.createElement("ul"); values.forEach(value=>{ const item=document.createElement("li"); item.textContent=safeText(value); list.append(item); }); container.append(list); }
      function detailField(body,label,value) { const heading=document.createElement("h3"),content=document.createElement("div"); heading.textContent=label; renderList(content,value); body.append(heading,content); }
      function roleNode(role,detail,activeRole,openRole) { const node=document.createElement("details"),summary=document.createElement("summary"),name=document.createElement("span"),status=document.createElement("span"),body=document.createElement("div"); const active=role===activeRole; node.className=`sc-task-view__node${active?" is-active":""}`; node.open=role===openRole; node.dataset.scRole=role; if (active) node.setAttribute("aria-current","step"); name.textContent=roleLabels[role]; status.className="sc-task-view__role-state"; status.textContent=detail.status?safeText(detail.status):"状态未提供"; summary.append(name,status); body.className="sc-task-view__detail"; detailField(body,"摘要",detail.summary); detailField(body,"必要证据",detail.evidence); detailField(body,"风险",detail.risks); detailField(body,"下一步",detail.next_action); node.append(summary,body); return node; }
      function renderRoles(root,details,activeRole,openRole) { const box=root.querySelector("[data-sc-roles]"),fragment=document.createDocumentFragment(); roles.forEach(role=>{ const connector=document.createElement("span"); connector.className="sc-task-view__connector"; connector.setAttribute("aria-hidden","true"); fragment.append(connector,roleNode(role,asObject(details[role]),activeRole,openRole)); }); box.replaceChildren(fragment); }
      function enforceSingleOpen(root) { root.__scAccordionCleanup?.(); const onToggle=event=>{ const opened=event.target; if (!opened.matches?.("details[data-sc-role]")||!opened.open) return; root.querySelectorAll("details[data-sc-role][open]").forEach(node=>{ if (node!==opened) node.open=false; }); }; root.addEventListener("toggle",onToggle,true); root.__scAccordionCleanup=()=>root.removeEventListener("toggle",onToggle,true); }
      const prefersReducedMotion=()=>matchMedia("(prefers-reduced-motion:reduce)").matches;
      function animateOnce(node,className,cleanups) { if (!node) return; node.classList.remove(className); void node.offsetWidth; node.classList.add(className); const finish=()=>{ node.classList.remove(className); node.removeEventListener("animationend",finish); node.removeEventListener("animationcancel",finish); }; node.addEventListener("animationend",finish,{once:true}); node.addEventListener("animationcancel",finish,{once:true}); cleanups.push(finish); }
      function bindAnimationControls(root) { if (root.__scAnimationButtonBound) return; const button=root.querySelector("[data-sc-play-animation]"); if (!button) return; const onClick=()=>{ root.__scManualMotionCleanup?.(); root.__scManualMotionCleanup=undefined; if (prefersReducedMotion()) return; const cleanups=[]; playEntranceEffects(root,cleanups); animateOnce(root.querySelector("details.is-active"),"is-manual-replay",cleanups); root.__scManualMotionCleanup=()=>cleanups.forEach(cleanup=>cleanup()); }; button.addEventListener("click",onClick); root.__scAnimationButtonBound=true; root.__scAnimationButtonCleanup=()=>button.removeEventListener("click",onClick); }
      function handoffFingerprint(handoffs) { return handoffs.map(item=>["from","to","state","handoff_result","reference_version"].map(field=>safeText(item[field])).join("\u001f")).join("\u001e"); }
      function playEntranceEffects(root,cleanups) { const view=root.matches(".sc-task-view")?root:root.querySelector(".sc-task-view"),flow=root.querySelector("[data-sc-flow]"); let timer=0; view?.classList.remove("is-entering"); flow?.classList.remove("is-connection-entering"); void root.offsetWidth; view?.classList.add("is-entering"); flow?.classList.add("is-connection-entering"); const finish=()=>{ view?.classList.remove("is-entering"); flow?.classList.remove("is-connection-entering"); }; timer=setTimeout(finish,900); cleanups.push(()=>{ clearTimeout(timer); finish(); }); }
      function playUpdateEffects(root,state,handoffs) { const previous=root.__scMotionSnapshot; root.__scMotionCleanup?.(); const current={state,handoffs:handoffFingerprint(handoffs)},cleanups=[]; root.__scMotionSnapshot=current; if (prefersReducedMotion()) return; if (!previous) playEntranceEffects(root,cleanups); else { if (previous.state!==state) { animateOnce(root.querySelector("[data-sc-root]"),"is-state-updated",cleanups); animateOnce(root.querySelector('[data-sc-field="state"]'),"is-state-updated",cleanups); } if (previous.handoffs!==current.handoffs) animateOnce(root.querySelector("[data-sc-flow]"),"is-handoff-flow",cleanups); } root.__scMotionCleanup=()=>cleanups.forEach(cleanup=>cleanup()); }
      window.renderSurveyCorpsTaskView=(root,snapshot)=>{ if (!(root instanceof Element)) throw new TypeError("root 必须是一个 DOM 元素"); const input=asObject(snapshot),work=asObject(input.work_unit),details=asObject(input.role_details),handoffs=asList(input.handoffs||input.handoff).map(asObject),state=input.state,activeRole=resolveActiveRole(details,state),userOpenRole=root.querySelector("details[data-sc-role][open]")?.dataset.scRole,openRole=root.__scResolvedActiveRole===activeRole?userOpenRole:activeRole,values={view_id:input.view_id,work_unit_id:work.work_unit_id,target:work.target,reference_version:work.reference_version}; Object.entries(values).forEach(([name,value])=>root.querySelectorAll(`[data-sc-field="${name}"]`).forEach(node=>node.textContent=safeText(value))); const status=root.querySelector('[data-sc-field="state"]'); if (status) { status.textContent=stateText(state); status.className=`sc-task-view__status ${stateClass(state)}`; } renderRoles(root,details,activeRole,openRole); root.__scResolvedActiveRole=activeRole; enforceSingleOpen(root); bindAnimationControls(root); playUpdateEffects(root,state,handoffs); };
    })();
  </script>
</section>
